[package]
name = "api-gateway"
version = "0.1.0"
edition = "2021"

[dependencies]
# Shared Rust library
common-rust = { path = "../../libs/common-rust", features = ["full"] }

axum = "0.7"
tokio = { version = "1.48.0", features = ["macros", "rt-multi-thread", "net", "signal", "sync"] }
tracing = "0.1.41"
tracing-subscriber = { version = "0.3.20", features = ["fmt", "env-filter", "json"] }
opentelemetry = { version = "0.29.0", features = ["trace"] }
opentelemetry-otlp = { version = "0.29.0", features = ["grpc-tonic", "metrics", "trace"] }
opentelemetry_sdk = { version = "0.29.0" }
tracing-opentelemetry = "0.30.0"
anyhow = "1.0.75"
prometheus = "0.14"
tower-http = { version = "0.6.6", features = ["trace", "cors"] }
time = "0.3.44"
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0"
mongodb = { version = "3.3.0", features = ["sync"] }
urlencoding = "2.1"

# gRPC dependencies
tonic = "0.12"
tonic-reflection = "0.12"
prost = "0.13"
prost-types = "0.13"
prost-reflect = { version = "0.14", features = ["serde"] }
tower = { version = "0.5", features = ["util"] }
thiserror = "1.0"
futures-util = "0.3"
tokio-stream = "0.1"
bytes = "1.5"

# Configuration
config = "0.14"
serde_yaml = "0.9"

# Time utilities
chrono = { version = "0.4", features = ["serde"] }

# UUID generation
uuid = { version = "1.0", features = ["v4"] }

# Metrics
lazy_static = "1.4"

# LRU cache for rate limiter
lru = "0.12"

# Redis for token + feature-flag caching (W17.1, W17.3)
redis = { version = "0.25", features = ["tokio-comp", "connection-manager"] }
sha2 = "0.10"
sha1 = "0.10"
hex = "0.4"
async-trait = "0.1"

# HTTP reverse-proxy client for §1a (SSO, impersonation, MFA-reset routes
# that bypass gRPC transcoding).
reqwest = { version = "0.11", features = ["json"] }

[build-dependencies]
tonic-build = "0.12"

[dev-dependencies]
criterion = { version = "0.5", features = ["html_reports"] }
proptest = "1.4"

[[bench]]
name = "routing_bench"
harness = false

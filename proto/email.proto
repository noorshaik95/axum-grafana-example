syntax = "proto3";

package email;

option go_package = "slate/services/email-service/api/proto";

import "google/protobuf/timestamp.proto";

// In-platform messaging service
service MessagingService {
  rpc SendMessage(SendMessageRequest) returns (SendMessageResponse);
  rpc GetInbox(GetInboxRequest) returns (GetInboxResponse);
  rpc MarkRead(MarkReadRequest) returns (MarkReadResponse);
  rpc GetThread(GetThreadRequest) returns (GetThreadResponse);
  rpc GetUnreadCount(GetUnreadCountRequest) returns (GetUnreadCountResponse);
}

message SendMessageRequest {
  string tenant_id = 1;
  string from_user_id = 2;
  repeated string recipient_ids = 3;
  string subject = 4;
  string body = 5;
}

message SendMessageResponse {
  string message_id = 1;
  string thread_id = 2;
  google.protobuf.Timestamp created_at = 3;
}

message GetInboxRequest {
  string tenant_id = 1;
  string user_id = 2;
  string cursor = 3;
  int32 limit = 4;
}

message GetInboxResponse {
  repeated InboxMessage messages = 1;
  string next_cursor = 2;
  bool has_more = 3;
}

message InboxMessage {
  string id = 1;
  string thread_id = 2;
  string from_user_id = 3;
  string subject = 4;
  string body = 5;
  bool is_read = 6;
  google.protobuf.Timestamp created_at = 7;
}

message MarkReadRequest {
  string message_id = 1;
  string user_id = 2;
}

message MarkReadResponse {
  bool success = 1;
}

message GetThreadRequest {
  string thread_id = 1;
}

message GetThreadResponse {
  repeated ThreadMessage messages = 1;
}

message ThreadMessage {
  string id = 1;
  string parent_id = 2;
  string from_user_id = 3;
  string subject = 4;
  string body = 5;
  google.protobuf.Timestamp created_at = 6;
}

message GetUnreadCountRequest {
  string tenant_id = 1;
  string user_id = 2;
}

message GetUnreadCountResponse {
  int32 count = 1;
}

server:
  http_listen_port: 9080
  grpc_listen_port: 0

positions:
  filename: /tmp/positions.yaml

clients:
  - url: http://loki:3100/loki/api/v1/push

scrape_configs:
  # ── user-auth-service (Go / zerolog JSON) ──────────────────────────────────
  - job_name: user-auth-service
    docker_sd_configs:
      - host: unix:///var/run/docker.sock
        refresh_interval: 5s
    relabel_configs:
      - source_labels: ['__meta_docker_container_name']
        regex: '/.*-user-auth-service-.*'
        action: keep
    pipeline_stages:
      - static_labels:
          job: user-auth-service
          service_name: user-auth-service
          environment: dev
      - json:
          expressions:
            level: level
            trace_id: trace_id
            message: message
            user_id: user_id
            operation: operation
            error_type: error_type
      - labels:
          level:
      - timestamp:
          source: time
          format: RFC3339Nano

  # ── api-gateway (Rust / tracing-subscriber JSON) ───────────────────────────

name: Onboarding Service CI

on:
  push:
    branches: [main, "claude/**"]
    paths:
      - "services/onboarding-service/**"
      - "libs/common-rust/**"
      - "proto/onboarding.proto"
      - ".github/workflows/onboarding-service-ci.yml"
  pull_request:
    branches: [main]
    paths:
      - "services/onboarding-service/**"
      - "proto/onboarding.proto"

defaults:
  run:
    working-directory: services/onboarding-service

jobs:
  check:
    name: Check & Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install system dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y cmake protobuf-compiler librdkafka-dev

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: "services/onboarding-service -> target"

      - name: Check formatting
        run: cargo fmt --check

      - name: Clippy
        run: cargo clippy -- -D warnings

  test:
    name: Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install system dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y cmake protobuf-compiler librdkafka-dev

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: "services/onboarding-service -> target"

      - name: Run tests
        run: cargo test --workspace

  build:
    name: Build
    runs-on: ubuntu-latest
    needs: [check, test]
    steps:
      - uses: actions/checkout@v4

      - name: Install system dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y cmake protobuf-compiler librdkafka-dev

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: "services/onboarding-service -> target"

      - name: Build release binary
        run: cargo build --release

      - name: Upload binary
        uses: actions/upload-artifact@v4
        with:
          name: onboarding-service
          path: services/onboarding-service/target/release/onboarding-service
          retention-days: 7

  docker:
    name: Docker Build
    runs-on: ubuntu-latest
    needs: [check, test]
    if: github.event_name == 'push'
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - uses: docker/build-push-action@v6
        with:
          context: .
          file: services/onboarding-service/Dockerfile
          push: false
          tags: onboarding-service:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

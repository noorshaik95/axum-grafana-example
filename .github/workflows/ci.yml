name: CI

on:
  push:
    branches: [main, dev]
  pull_request:
    branches: [main, dev]

concurrency:
  group: "ci-${{ github.ref }}"
  cancel-in-progress: true

jobs:
  # ──────────────────────────────────────────────────
  # Frontend: lint + typecheck
  # ──────────────────────────────────────────────────
  lint-typecheck:
    name: "Lint & Typecheck (${{ matrix.app }})"
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        app: [student, admin, provider]
    defaults:
      run:
        working-directory: "frontend/${{ matrix.app }}"
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: "frontend/${{ matrix.app }}/package-lock.json"

      - run: npm ci

      - name: TypeScript typecheck
        run: npx tsc --noEmit

      - name: Lint
        run: npm run lint

  # ──────────────────────────────────────────────────
  # Frontend: build
  # ──────────────────────────────────────────────────
  build-frontend:
    name: "Build Frontend (${{ matrix.app }})"
    runs-on: ubuntu-latest
    needs: lint-typecheck
    strategy:
      fail-fast: false
      matrix:
        app: [student, admin, provider]
    defaults:
      run:
        working-directory: "frontend/${{ matrix.app }}"
    env:
      NEXT_PUBLIC_API_URL: "http://localhost:8080"
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: "frontend/${{ matrix.app }}/package-lock.json"

      - run: npm ci
      - run: npm run build

  # ──────────────────────────────────────────────────
  # Go services: build + vet + test
  # ──────────────────────────────────────────────────
  build-go:
    name: "Build Go (${{ matrix.service }})"
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        service: [user-auth-service, assignment-grading-service]
    defaults:
      run:
        working-directory: "services/${{ matrix.service }}"
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: "1.24"
          cache: true
          cache-dependency-path: "services/${{ matrix.service }}/go.sum"

      - run: go build ./...
      - run: go vet ./...
      - run: go test ./... -timeout 60s

  # ──────────────────────────────────────────────────
  # Rust services: check + test
  # ──────────────────────────────────────────────────
  build-rust:
    name: "Build Rust (${{ matrix.service }})"
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        service: [api-gateway, content-management-service]
    defaults:
      run:
        working-directory: "services/${{ matrix.service }}"
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: "services/${{ matrix.service }} -> target"
          key: "${{ matrix.service }}"

      - run: cargo check
      - run: cargo test

  # ──────────────────────────────────────────────────
  # NestJS: course-service build
  # ──────────────────────────────────────────────────
  build-nestjs:
    name: "Build NestJS (course-service)"
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: services/course-service
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: services/course-service/package-lock.json

      - run: npm ci
      - run: npm run build

  # ──────────────────────────────────────────────────
  # Validate docker-compose config
  # ──────────────────────────────────────────────────
  validate-compose:
    name: Validate docker-compose
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker compose config --quiet

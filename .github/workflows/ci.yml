name: CI

on:
  push:
    branches: [main, dev]
  pull_request:
    branches: [main, dev]

concurrency:
  group: "ci-${{ github.ref }}"
  cancel-in-progress: true

jobs:
  # ──────────────────────────────────────────────────
  # Frontend: lint + typecheck
  # ──────────────────────────────────────────────────
  lint-typecheck:
    name: "Lint & Typecheck (${{ matrix.app }})"
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        app: [student, admin, provider]
    defaults:
      run:
        working-directory: "frontend/${{ matrix.app }}"
    env:
      HUSKY: "0" # git hooks are irrelevant in CI; prevents 'husky: not found' error
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: "frontend/${{ matrix.app }}/package-lock.json"

      - run: npm ci

      - name: TypeScript typecheck
        run: npx tsc --noEmit

      - name: Lint
        run: npm run lint

  # ──────────────────────────────────────────────────
  # Frontend: build
  # ──────────────────────────────────────────────────
  build-frontend:
    name: "Build Frontend (${{ matrix.app }})"
    runs-on: ubuntu-latest
    needs: lint-typecheck
    strategy:
      fail-fast: false
      matrix:
        app: [student, admin, provider]
    defaults:
      run:
        working-directory: "frontend/${{ matrix.app }}"
    env:
      NEXT_PUBLIC_API_URL: "http://localhost:8080"
      HUSKY: "0"
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: "frontend/${{ matrix.app }}/package-lock.json"

      - run: npm ci
      - run: npm run build

  # ──────────────────────────────────────────────────
  # Go services: build + vet + test
  # ──────────────────────────────────────────────────
  build-go:
    name: "Build Go (${{ matrix.service }})"
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - service: user-auth-service
            proto-files: "../../proto/user.proto ../../proto/auth.proto"
            proto-mv: |
              mkdir -p api/proto api/proto/authpb
              mv -f user.pb.go user_grpc.pb.go api/proto/ 2>/dev/null || true
              mv -f auth.pb.go auth_grpc.pb.go api/proto/authpb/ 2>/dev/null || true
          - service: assignment-grading-service
            proto-files: "../../proto/assignment.proto"
            proto-mv: |
              mkdir -p api/proto
              mv -f assignment.pb.go assignment_grpc.pb.go api/proto/ 2>/dev/null || true
    defaults:
      run:
        working-directory: "services/${{ matrix.service }}"
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: "1.24"
          cache: true
          cache-dependency-path: "services/${{ matrix.service }}/go.sum"

      - name: Install protoc and plugins
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y protobuf-compiler
          go install google.golang.org/protobuf/cmd/protoc-gen-go@v1.32.0
          go install google.golang.org/grpc/cmd/protoc-gen-go-grpc@v1.3.0
          echo "$(go env GOPATH)/bin" >> $GITHUB_PATH

      - name: Generate proto files
        run: |
          protoc --go_out=. --go_opt=paths=source_relative \
            --go-grpc_out=. --go-grpc_opt=paths=source_relative \
            -I ../../proto ${{ matrix.proto-files }}
          ${{ matrix.proto-mv }}

      - run: go build ./...
      - run: go vet ./...
      - run: go test ./... -timeout 60s

  # ──────────────────────────────────────────────────
  # Rust services: check + test
  # ──────────────────────────────────────────────────
  build-rust:
    name: "Build Rust (${{ matrix.service }})"
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - service: api-gateway
            # build.rs compiles proto files
            apt-deps: protobuf-compiler
          - service: content-management-service
            # rdkafka cmake-build compiles librdkafka from source;
            # rdkafka_conf.c includes curl/curl.h unconditionally even when
            # -DWITH_CURL=0 is passed, so libcurl dev headers are required
            apt-deps: protobuf-compiler cmake libssl-dev libsasl2-dev libcurl4-openssl-dev
    defaults:
      run:
        working-directory: "services/${{ matrix.service }}"
    steps:
      - uses: actions/checkout@v4

      - name: Install system dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y ${{ matrix.apt-deps }}

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: "services/${{ matrix.service }} -> target"
          key: "${{ matrix.service }}"

      - run: cargo check
      - run: cargo test

  # ──────────────────────────────────────────────────
  # NestJS: course-service build
  # ──────────────────────────────────────────────────
  build-nestjs:
    name: "Build NestJS (course-service)"
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: services/course-service
    env:
      HUSKY: "0"
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: services/course-service/package-lock.json

      - run: npm ci
      - run: npm run build

  # ──────────────────────────────────────────────────
  # Validate docker-compose config
  # ──────────────────────────────────────────────────
  validate-compose:
    name: Validate docker-compose
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker compose config --quiet

name: Docker Build

on:
  push:
    branches: [main]

concurrency:
  group: "docker-${{ github.ref }}"
  cancel-in-progress: true

jobs:
  docker-build:
    name: "Docker Build (${{ matrix.image }})"
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          # ── Backend services (build context: repo root) ──────────────────
          - image: api-gateway
            context: "."
            dockerfile: services/api-gateway/Dockerfile
          - image: user-auth-service
            context: "."
            dockerfile: services/user-auth-service/Dockerfile
          - image: course-service
            context: "."
            dockerfile: services/course-service/Dockerfile
          - image: assignment-grading-service
            context: "."
            dockerfile: services/assignment-grading-service/Dockerfile
          - image: content-management-service
            context: "."
            dockerfile: services/content-management-service/Dockerfile
          - image: email-service
            context: "."
            dockerfile: services/email-service/Dockerfile
          - image: metrics-service
            context: "."
            dockerfile: services/metrics-service/Dockerfile
          - image: tenant-service
            context: "."
            dockerfile: services/tenant-service/Dockerfile
          - image: video-conferencing-service
            context: "."
            dockerfile: services/video-conferencing-service/Dockerfile
          - image: onboarding-service
            context: "."
            dockerfile: services/onboarding-service/Dockerfile
          # ── Frontend services (build context: frontend/ parent dir) ──────
          # Dockerfiles reference shared/ which lives alongside admin/student/provider
          # inside frontend/, so context must be the parent, not the app subdir.
          - image: student-frontend
            context: "frontend"
            dockerfile: frontend/student/Dockerfile
            build-args: "NEXT_PUBLIC_API_URL=http://localhost:8080"
          - image: provider-frontend
            context: "frontend"
            dockerfile: frontend/provider/Dockerfile
            build-args: "NEXT_PUBLIC_API_URL=http://localhost:8080"
          - image: admin-frontend
            context: "frontend"
            dockerfile: frontend/admin/Dockerfile
            build-args: "NEXT_PUBLIC_API_URL=http://localhost:8080"
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - uses: docker/build-push-action@v6
        with:
          context: "${{ matrix.context }}"
          file: "${{ matrix.dockerfile }}"
          push: false
          tags: |
            slate/${{ matrix.image }}:${{ github.sha }}
            slate/${{ matrix.image }}:latest
          build-args: "${{ matrix.build-args || '' }}"
          cache-from: "type=gha,scope=${{ matrix.image }}"
          cache-to: "type=gha,mode=max,scope=${{ matrix.image }}"

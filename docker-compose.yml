  loki:
    image: grafana/loki:2.9.3
    command: "-config.file=/etc/loki/local-config.yaml"
    volumes:
      - ./config/loki.yaml:/etc/loki/local-config.yaml
      - loki-data:/loki
    ports:
      - "3100:3100"
    user: root
    deploy:
      resources:
        limits:
          cpus: '0.5'

version: '3.8'

name: slate

services:
  # ============================================================================
  # Reverse Proxy
  # ============================================================================

  traefik:
    image: traefik:v3.0
    command:
      - "--configFile=/config/traefik/traefik.yml"
    ports:
      - "80:80"
      - "8090:8080"   # Traefik dashboard
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - ./config/traefik:/config/traefik
    networks:
      - slate-network
    labels:
      - "traefik.enable=true"
    restart: unless-stopped
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 256M
        reservations:
          cpus: '0.25'
          memory: 128M

  # ============================================================================
  # Infrastructure Services
  # ============================================================================

  # PostgreSQL Database for User Auth Service
  postgres:
    image: postgres:15-alpine
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: userauth
    ports:
      - "5435:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./config/postgres-init:/docker-entrypoint-initdb.d
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U postgres" ]
      interval: 10s
      timeout: 5s
      retries: 5
    deploy:
      resources:
        limits:
          cpus: '1.0'
          memory: 1G
        reservations:
          cpus: '0.5'
          memory: 512M
    restart: unless-stopped

  # PostgreSQL Database for Assignment Grading Service
  assignment-grading-db:
    image: postgres:15-alpine
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: assignment_grading
    ports:
      - "5433:5432"
    volumes:
      - assignment-grading-data:/var/lib/postgresql/data
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U postgres" ]
      interval: 10s
      timeout: 5s
      retries: 5
    deploy:
      resources:
        limits:
          cpus: '1.0'
          memory: 1G
        reservations:
          cpus: '0.5'
          memory: 512M
    restart: unless-stopped

  # PostgreSQL Database for Content Management Service
  postgres-cms:
    image: postgres:15-alpine
    environment:
      POSTGRES_USER: cms
      POSTGRES_PASSWORD: cms_password
      POSTGRES_DB: cms
    ports:
      - "5434:5432"
    volumes:
      - postgres-cms-data:/var/lib/postgresql/data
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U cms" ]
      interval: 10s
      timeout: 5s
      retries: 5
    deploy:
      resources:
        limits:
          cpus: '1.0'
          memory: 1G
        reservations:
          cpus: '0.5'
          memory: 512M
    restart: unless-stopped

  # Redis for Rate Limiting and Job Queue
  redis:
    image: redis:7-alpine
    command: redis-server --appendonly yes --maxmemory 256mb --maxmemory-policy allkeys-lru
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data
    healthcheck:
      test: [ "CMD", "redis-cli", "ping" ]
      interval: 10s
      timeout: 3s
      retries: 5
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 256M
        reservations:
          cpus: '0.25'
          memory: 128M
    restart: unless-stopped

  # MongoDB Database for Course Service
  mongodb:
    image: mongo:7-jammy
    container_name: slate-mongodb
    environment:
      MONGO_INITDB_DATABASE: courses
    ports:
      - "27017:27017"
    volumes:
      - mongodb-data:/data/db
    healthcheck:
      test: [ "CMD", "mongosh", "--eval", "db.adminCommand('ping')" ]
      interval: 10s
      timeout: 5s
      retries: 5
    deploy:
      resources:
        limits:
          cpus: '1.0'
          memory: 1G
        reservations:
          cpus: '0.5'
          memory: 512M
    restart: unless-stopped

  # MinIO for S3-compatible object storage
  minio:
    image: minio/minio:latest
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio-data:/data
    healthcheck:
      test: [ "CMD", "curl", "-f", "http://localhost:9000/minio/health/live" ]
      interval: 30s
      timeout: 20s
      retries: 3
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 512M
        reservations:
          cpus: '0.25'
          memory: 256M
    restart: unless-stopped

  # ElasticSearch for content search
  elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:8.11.0
    environment:
      - discovery.type=single-node
      - xpack.security.enabled=false
      - "ES_JAVA_OPTS=-Xms512m -Xmx512m"
    ports:
      - "9200:9200"
    volumes:
      - elasticsearch-data:/usr/share/elasticsearch/data
    healthcheck:
      test: [ "CMD-SHELL", "curl -f http://localhost:9200/_cluster/health || exit 1" ]
      interval: 30s
      timeout: 10s
      retries: 5
    deploy:
      resources:
        limits:
          cpus: '1.0'
          memory: 1G
        reservations:
          cpus: '0.5'
          memory: 512M
    restart: unless-stopped

  # Kafka (KRaft mode — no Zookeeper required)
  kafka:
    image: confluentinc/cp-kafka:7.5.0
    ports:
      - "9097:9092"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_LISTENERS: PLAINTEXT://0.0.0.0:9092,CONTROLLER://0.0.0.0:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,CONTROLLER:PLAINTEXT
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
      KAFKA_LOG_DIRS: /var/lib/kafka/data
      CLUSTER_ID: "MkU3OEVBNTcwNTJENDM2Qk"
    volumes:
      - kafka-data:/var/lib/kafka/data
    healthcheck:
      test: [ "CMD-SHELL", "kafka-broker-api-versions --bootstrap-server localhost:9092 || exit 1" ]
      interval: 15s
      timeout: 10s
      retries: 5
      start_period: 30s
    deploy:
      resources:
        limits:
          cpus: '1.0'
          memory: 1G
        reservations:
          cpus: '0.5'
          memory: 512M
    restart: unless-stopped

  # ============================================================================
  # Backend Services
  # ============================================================================

  # User Auth Service (Go)
  user-auth-service:
    build:
      context: .
      dockerfile: services/user-auth-service/Dockerfile
    environment:
      SERVER_HOST: "0.0.0.0"
      SERVER_PORT: "8081"
      DB_HOST: "postgres"
      DB_PORT: "5432"
      DB_USER: "postgres"
      DB_PASSWORD: "postgres"
      DB_NAME: "userauth"
      DB_SSLMODE: "disable"
      JWT_SECRET: "your-super-secret-jwt-key-change-in-production"
      JWT_ACCESS_TOKEN_DURATION: "15"
      JWT_REFRESH_TOKEN_DURATION: "168"
      GRPC_HOST: "0.0.0.0"
      GRPC_PORT: "50051"
      OTEL_EXPORTER_OTLP_ENDPOINT: "tempo:4317"
      REDIS_HOST: "redis"
      REDIS_PORT: "6379"
      RATE_LIMIT_ENABLED: "false"
      RATE_LIMIT_LOGIN_MAX: "1000"
      RATE_LIMIT_LOGIN_WINDOW: "60"
      RATE_LIMIT_REGISTER_MAX: "1000"
      RATE_LIMIT_REGISTER_WINDOW: "60"
      AUTH_TYPE: "normal"
      OAUTH_GOOGLE_CLIENT_ID: "mock-google-client-id"
      OAUTH_GOOGLE_CLIENT_SECRET: "mock-google-client-secret"
      OAUTH_GOOGLE_REDIRECT_URI: "http://localhost:8080/auth/oauth/callback"
      OAUTH_GOOGLE_SCOPES: "openid,profile,email"
      SAML_SP_ENTITY_ID: "http://localhost:8080/saml/metadata"
      SAML_ACS_URL: "http://localhost:8080/auth/saml/acs"
      SAML_OKTA_ENTITY_ID: "http://mock-okta.example.com"
      SAML_OKTA_SSO_URL: "http://mock-okta.example.com/sso"
      SAML_OKTA_JIT_PROVISIONING: "true"
      SAML_OKTA_ORGANIZATION_ID: "test-org"
      DB_MAX_OPEN_CONNS: "25"
      DB_MAX_IDLE_CONNS: "5"
      DB_CONN_MAX_LIFETIME: "5m"
      DB_CONN_MAX_IDLE_TIME: "1m"
      LOG_LEVEL: "info"
      ENVIRONMENT: "development"
    ports:
      - "50051:50051"
      - "8081:8081"
      - "9091:9090"
    healthcheck:
      test: [ "CMD-SHELL", "wget -qO- http://localhost:8081/health || exit 1" ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      tempo:
        condition: service_started
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 256M
        reservations:
          cpus: '0.25'
          memory: 128M
    restart: unless-stopped

  # Course Management Service (NestJS/MongoDB)
  course-service:
    build:
      context: .
      dockerfile: services/course-service/Dockerfile
    environment:
      NODE_ENV: "production"
      PORT: "3001"
      GRPC_HOST: "0.0.0.0"
      GRPC_PORT: "50052"
      MONGO_URI: "mongodb://mongodb:27017/courses"
      MONGO_DB_NAME: "courses"
      OTEL_EXPORTER_OTLP_ENDPOINT: "http://tempo:4317"
      LOG_LEVEL: "info"
      METRICS_PORT: "9090"
      SERVICE_VERSION: "1.0.0"
      PROTO_PATH: "/app/proto/course.proto"
      PROTO_DIR: "/app/proto"
    ports:
      - "50052:50052"
      - "3001:3001"
      - "9094:9090"
    healthcheck:
      test: [ "CMD-SHELL", "wget -qO- http://localhost:3001/health || exit 1" ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s
    depends_on:
      mongodb:
        condition: service_healthy
      tempo:
        condition: service_started
    deploy:
      resources:
        limits:
          cpus: '1.0'
          memory: 512M
        reservations:
          cpus: '0.5'
          memory: 256M
    restart: unless-stopped

  # Content Management Service (Rust)
  content-management-service:
    build:
      context: .
      dockerfile: services/content-management-service/Dockerfile
    environment:
      SERVER__HOST: "0.0.0.0"
      SERVER__PORT: "8082"
      SERVER__GRPC_PORT: "50054"
      SERVER__METRICS_PORT: "9092"
      DATABASE__URL: "postgresql://cms:cms_password@postgres-cms:5432/cms"
      DATABASE__MAX_CONNECTIONS: "20"
      DATABASE__MIN_CONNECTIONS: "5"
      S3__ENDPOINT: "http://minio:9000"
      S3__ACCESS_KEY: "minioadmin"
      S3__SECRET_KEY: "minioadmin"
      S3__BUCKET: "content-storage"
      S3__REGION: "us-east-1"
      ELASTICSEARCH__URL: "http://elasticsearch:9200"
      ELASTICSEARCH__INDEX: "content"
      REDIS__URL: "redis://redis:6379"
      REDIS__QUEUE_NAME: "transcoding_jobs"
      MINIO_ENDPOINT: "http://minio:9000"
      MINIO_ACCESS_KEY: "minioadmin"
      MINIO_SECRET_KEY: "minioadmin"
      MINIO_BUCKET_PREFIX: "slate-content"
      KAFKA__BROKERS: "kafka:9092"
      KAFKA__CONSUMER_GROUP: "content-management-service"
      OBSERVABILITY__OTLP_ENDPOINT: "http://tempo:4317"
      OBSERVABILITY__SERVICE_NAME: "content-management-service"
      RUST_LOG: "info"
    ports:
      - "50054:50054"
      - "8082:8082"
      - "9096:9092"
    healthcheck:
      test: [ "CMD-SHELL", "curl -sf http://localhost:9092/health || exit 1" ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    depends_on:
      postgres-cms:
        condition: service_healthy
      minio:
        condition: service_healthy
      elasticsearch:
        condition: service_healthy
      redis:
        condition: service_healthy
      tempo:
        condition: service_started
    deploy:
      resources:
        limits:
          cpus: '1.0'
          memory: 1G
        reservations:
          cpus: '0.5'
          memory: 512M
    restart: unless-stopped

  # Assignment Grading Service (Go)
  assignment-grading-service:
    build:
      context: .
      dockerfile: services/assignment-grading-service/Dockerfile
    environment:
      SERVER_HOST: "0.0.0.0"
      SERVER_PORT: "8083"
      DB_HOST: "assignment-grading-db"
      DB_PORT: "5432"
      DB_USER: "postgres"
      DB_PASSWORD: "postgres"
      DB_NAME: "assignment_grading"
      DB_SSLMODE: "disable"
      GRPC_HOST: "0.0.0.0"
      GRPC_PORT: "50053"
      KAFKA_ENABLED: "true"
      KAFKA_BROKERS: "kafka:9092"
      KAFKA_TOPIC: "assignment-events"
      STORAGE_TYPE: "local"
      STORAGE_LOCAL_PATH: "/app/storage"
      STORAGE_MAX_SIZE: "26214400"
      OTEL_EXPORTER_OTLP_ENDPOINT: "tempo:4317"
      LOG_LEVEL: "info"
      ENVIRONMENT: "development"
      DB_MAX_OPEN_CONNS: "25"
      DB_MAX_IDLE_CONNS: "5"
      DB_CONN_MAX_LIFETIME: "5m"
      DB_CONN_MAX_IDLE_TIME: "1m"
    ports:
      - "50053:50053"
      - "8083:8083"
      - "9093:9090"
    volumes:
      - assignment-storage:/app/storage
    healthcheck:
      test: [ "CMD-SHELL", "wget -qO- http://localhost:8083/health || exit 1" ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s
    depends_on:
      assignment-grading-db:
        condition: service_healthy
      kafka:
        condition: service_healthy
      tempo:
        condition: service_started
    deploy:
      resources:
        limits:
          cpus: '1.0'
          memory: 512M
        reservations:
          cpus: '0.5'
          memory: 256M
    restart: unless-stopped

  # API Gateway (Rust/Axum)
  api-gateway:
    build:
      context: .
      dockerfile: services/api-gateway/Dockerfile
    environment:
      RUST_LOG: "info"
      GATEWAY_SERVER_HOST: "0.0.0.0"
      GATEWAY_SERVER_PORT: "8080"
      GATEWAY_AUTH_SERVICE_ENDPOINT: "http://user-auth-service:50051"
      GATEWAY_OBSERVABILITY_TEMPO_ENDPOINT: "http://tempo:4317"
      AUTH_TYPE: "normal"
      MAX_REQUEST_BODY_SIZE: "1048576"
      MAX_UPLOAD_BODY_SIZE: "26214400"
      UPLOAD_PATHS: "/upload,/api/upload,/api/assignments/*/submissions"
      CORS_ALLOWED_ORIGINS: "http://localhost:3000,http://localhost:3002,http://localhost:3003,http://app.slate.local,http://teach.slate.local,http://admin.slate.local"
    ports:
      - "8080:8080"
    volumes:
      - ./config/gateway-config.yaml:/app/config/gateway-config.yaml
      - ./services/api-gateway/openapi:/app/services/api-gateway/openapi
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.api-gateway.rule=Host(`api.slate.local`)"
      - "traefik.http.routers.api-gateway.entrypoints=web"
      - "traefik.http.services.api-gateway.loadbalancer.server.port=8080"
    networks:
      - slate-network
    healthcheck:
      test: [ "CMD-SHELL", "curl -sf http://localhost:8080/health || exit 1" ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s
    depends_on:
      user-auth-service:
        condition: service_healthy
      assignment-grading-service:
        condition: service_healthy
      content-management-service:
        condition: service_healthy
      course-service:
        condition: service_healthy
    deploy:
      resources:
        limits:
          cpus: '1.0'
          memory: 512M
        reservations:
          cpus: '0.5'
          memory: 256M
    restart: unless-stopped

  # ============================================================================
  # Frontend Services
  # ============================================================================

  # Student Frontend (Next.js, port 3000)
  student-frontend:
    build:
      context: ./frontend
      dockerfile: student/Dockerfile
      args:
        NEXT_PUBLIC_API_URL: "http://localhost:8080"
    environment:
      NEXT_PUBLIC_API_URL: "http://localhost:8080"
      PORT: "3000"
    ports:
      - "3000:3000"
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.student-frontend.rule=Host(`app.slate.local`)"
      - "traefik.http.routers.student-frontend.entrypoints=web"
      - "traefik.http.services.student-frontend.loadbalancer.server.port=3000"
    networks:
      - slate-network
    depends_on:
      api-gateway:
        condition: service_healthy
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 512M
        reservations:
          cpus: '0.25'
          memory: 256M
    restart: unless-stopped

  # Provider/Instructor Frontend (Next.js, port 3002)
  provider-frontend:
    build:
      context: ./frontend
      dockerfile: provider/Dockerfile
      args:
        NEXT_PUBLIC_API_URL: "http://localhost:8080"
    environment:
      NEXT_PUBLIC_API_URL: "http://localhost:8080"
      PORT: "3002"
    ports:
      - "3002:3002"
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.provider-frontend.rule=Host(`teach.slate.local`)"
      - "traefik.http.routers.provider-frontend.entrypoints=web"
      - "traefik.http.services.provider-frontend.loadbalancer.server.port=3002"
    networks:
      - slate-network
    depends_on:
      api-gateway:
        condition: service_healthy
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 512M
        reservations:
          cpus: '0.25'
          memory: 256M
    restart: unless-stopped

  # Admin Frontend (Next.js, port 3003)
  admin-frontend:
    build:
      context: ./frontend
      dockerfile: admin/Dockerfile
      args:
        NEXT_PUBLIC_API_URL: "http://localhost:8080"
    environment:
      NEXT_PUBLIC_API_URL: "http://localhost:8080"
      PORT: "3003"
    ports:
      - "3003:3003"
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.admin-frontend.rule=Host(`admin.slate.local`)"
      - "traefik.http.routers.admin-frontend.entrypoints=web"
      - "traefik.http.services.admin-frontend.loadbalancer.server.port=3003"
    networks:
      - slate-network
    depends_on:
      api-gateway:
        condition: service_healthy
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 512M
        reservations:
          cpus: '0.25'
          memory: 256M
    restart: unless-stopped

  # Restate Server (Durable Workflow Orchestration)
  restate-server:
    image: docker.restate.dev/restatedev/restate:latest
    ports:
      - "9080:9080"   # HTTP ingress
      - "9095:9090"   # Admin API (9090 taken by Prometheus)
      - "5005:5005"   # Service discovery
    environment:
      RESTATE_LOG_LEVEL: info
    networks:
      - slate-network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9080/restate/health"]
      interval: 10s
      timeout: 5s
      retries: 5
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 512M
        reservations:
          cpus: '0.25'
          memory: 256M
    restart: unless-stopped

  # Onboarding Service (Rust + Restate)
  onboarding-service:
    build:
      context: .
      dockerfile: services/onboarding-service/Dockerfile
    environment:
      RESTATE_ENDPOINT: "http://restate-server:9090"
      KAFKA_BROKERS: "kafka:9092"
      RUST_LOG: "info,onboarding_service=debug"
    ports:
      - "8084:9080"   # Restate handler endpoint
      - "8085:9081"   # Health check endpoint
    networks:
      - slate-network
    depends_on:
      restate-server:
        condition: service_healthy
      kafka:
        condition: service_healthy
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 256M
    restart: unless-stopped

  # ============================================================================
  # Observability Stack
  # ============================================================================

  prometheus:
    image: prom/prometheus:v2.48.0
    volumes:
      - ./config/prometheus.yml:/etc/prometheus/prometheus.yml
    ports:
      - "9090:9090"
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 512M
        reservations:
          cpus: '0.25'
          memory: 256M
    restart: unless-stopped

  tempo:
    image: grafana/tempo:2.3.1
    command: [ "-config.file=/etc/tempo/tempo.yaml" ]
    volumes:
      - ./config/tempo.yaml:/etc/tempo/tempo.yaml
    ports:
      - "14268:14268"
      - "3200:3200"
      - "4317:4317"
      - "4318:4318"
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 512M
        reservations:
          cpus: '0.25'
          memory: 256M
    restart: unless-stopped

  loki:
    image: grafana/loki:2.9.3
    command: "-config.file=/etc/loki/local-config.yaml"
    volumes:
      - ./config/loki.yaml:/etc/loki/local-config.yaml
      - loki-data:/loki
    ports:
      - "3100:3100"
    user: root
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 512M
        reservations:
          cpus: '0.25'
          memory: 256M
    restart: unless-stopped

  grafana:
    image: grafana/grafana:latest
    environment:
      - GF_SECURITY_ADMIN_USER=admin
      - GF_SECURITY_ADMIN_PASSWORD=admin
      - GF_AUTH_ANONYMOUS_ENABLED=true
      - GF_AUTH_ANONYMOUS_ORG_ROLE=Admin
      - GF_UNIFIED_ALERTING_ENABLED=true
      - GF_ALERTING_ENABLED=false
    volumes:
      - ./config/grafana-datasources.yaml:/etc/grafana/provisioning/datasources/datasources.yaml
      - ./config/grafana-dashboard-provider.yaml:/etc/grafana/provisioning/dashboards/default.yaml
      - ./config/grafana-dashboards:/etc/grafana/provisioning/dashboards/slate
      - ./config/grafana.ini:/etc/grafana/grafana.ini
      - grafana-data:/var/lib/grafana
    ports:
      - "3500:3000"
    depends_on:
      - prometheus
      - tempo
      - loki
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 256M
        reservations:
          cpus: '0.25'
          memory: 128M
    restart: unless-stopped

  promtail:
    image: grafana/promtail:latest
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - /var/lib/docker/containers:/var/lib/docker/containers:ro
      - /var/log:/var/log:ro
      - ./config/promtail-config.yaml:/etc/promtail/promtail-config.yaml
    command: -config.file=/etc/promtail/promtail-config.yaml
    depends_on:
      - loki
    deploy:
      resources:
        limits:
          cpus: '0.25'
          memory: 128M
        reservations:
          cpus: '0.1'
          memory: 64M
    restart: unless-stopped

  # Tenant Service (Go)
  tenant-service:
    build:
      context: .
      dockerfile: services/tenant-service/Dockerfile
    environment:
      SERVER_HOST: "0.0.0.0"
      SERVER_PORT: "8083"
      GRPC_HOST: "0.0.0.0"
      GRPC_PORT: "50053"
      DB_HOST: "postgres"
      DB_PORT: "5432"
      DB_USER: "postgres"
      DB_PASSWORD: "postgres"
      DB_NAME: "tenantdb"
      DB_SSLMODE: "disable"
      OTEL_EXPORTER_OTLP_ENDPOINT: "tempo:4317"
      REDIS_HOST: "redis"
      REDIS_PORT: "6379"
      USER_SERVICE_URL: "user-auth-service:50051"
      EMAIL_SERVICE_URL: "email-service:50052"
      EMAIL_ENABLED: "true"
      WELCOME_EMAIL_DELAY_SECONDS: "5"
      BASE_SETUP_URL: "http://localhost:8080"
      LOG_LEVEL: "info"
      ENVIRONMENT: "development"
      DOCKER_SOCKET: "/var/run/docker.sock"
      DOCKER_NETWORK: "slate-network"
      TRAEFIK_CONFIG_DIR: "/config/traefik/dynamic"
      KAFKA_BROKERS: "kafka:9092"
      KAFKA_GROUP_ID: "tenant-service"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - ./config/traefik/dynamic:/config/traefik/dynamic
    ports:
      - "50057:50053"   # gRPC
      - "8087:8083"     # HTTP
      - "9100:9090"     # Metrics
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      user-auth-service:
        condition: service_started
      email-service:
        condition: service_started
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 256M
    restart: unless-stopped

  # Email Service (Go)
  email-service:
    build:
      context: .
      dockerfile: services/email-service/Dockerfile
    environment:
      SERVER_HOST: "0.0.0.0"
      SERVER_PORT: "8082"
      GRPC_HOST: "0.0.0.0"
      GRPC_PORT: "50052"
      DB_HOST: "postgres"
      DB_PORT: "5432"
      DB_USER: "postgres"
      DB_PASSWORD: "postgres"
      DB_NAME: "emaildb"
      DB_SSLMODE: "disable"
      OTEL_EXPORTER_OTLP_ENDPOINT: "tempo:4317"
      LOG_LEVEL: "info"
    ports:
      - "50058:50052"   # gRPC
      - "8088:8082"     # HTTP
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped

  # Metrics Service (Go)
  metrics-service:
    build:
      context: .
      dockerfile: services/metrics-service/Dockerfile
    environment:
      SERVER_HOST: "0.0.0.0"
      SERVER_PORT: "8087"
      GRPC_HOST: "0.0.0.0"
      GRPC_PORT: "50057"
      DB_HOST: "postgres"
      DB_PORT: "5432"
      DB_USER: "postgres"
      DB_PASSWORD: "postgres"
      DB_NAME: "metricsdb"
      DB_SSLMODE: "disable"
      OTEL_EXPORTER_OTLP_ENDPOINT: "tempo:4317"
      PROMETHEUS_URL: "http://prometheus:9090"
      METRICS_UPDATE_INTERVAL: "30"
      LOG_LEVEL: "info"
      ENVIRONMENT: "development"
    ports:
      - "50059:50057"   # gRPC
      - "8089:8087"     # HTTP
    depends_on:
      postgres:
        condition: service_healthy
      prometheus:
        condition: service_started
    restart: unless-stopped

  # Video Conferencing Service (Rust/WebRTC)
  video-conferencing-service:
    build:
      context: .
      dockerfile: services/video-conferencing-service/Dockerfile
    environment:
      SERVER_HOST: "0.0.0.0"
      GRPC_PORT: "50052"
      WS_PORT: "8082"
      HTTP_PORT: "8082"
      DB_HOST: "postgres"
      DB_PORT: "5432"
      DB_NAME: "slate_video"
      DB_USER: "postgres"
      DB_PASSWORD: "postgres"
      DB_MAX_CONNECTIONS: "25"
      WEBRTC_PORT_MIN: "51000"
      WEBRTC_PORT_MAX: "51100"
      RECORDING_ENABLED: "false"
      GCS_BUCKET: "slate-recordings"
      GCS_PROJECT_ID: "slate-project"
      RECORDING_TIMEOUT: "1800"
      TEMP_STORAGE_PATH: "/tmp/recordings"
      TEMPO_ENDPOINT: "http://tempo:4317"
      SERVICE_NAME: "video-conferencing-service"
      PROMETHEUS_PORT: "9092"
      RUST_LOG: "info,video_conferencing_service=debug"
      MAX_PARTICIPANTS: "50"
      JOIN_WINDOW_MINUTES: "10"
      DEFAULT_DURATION_MINUTES: "60"
      MAX_DURATION_MINUTES: "240"
      AUTO_END_AFTER_MINUTES: "300"
    ports:
      - "50056:50052"        # gRPC
      - "8086:8082"          # HTTP/WebSocket
      - "9099:9092"          # Prometheus metrics
      - "51000-51100:51000-51100/udp"  # WebRTC media
    volumes:
      - video-recordings:/tmp/recordings
    depends_on:
      postgres:
        condition: service_healthy
      tempo:
        condition: service_started
    deploy:
      resources:
        limits:
          cpus: '1.0'
          memory: 512M
        reservations:
          cpus: '0.5'
          memory: 256M
    restart: unless-stopped

volumes:
  postgres-data:
    driver: local
  assignment-grading-data:
    driver: local
  assignment-storage:
    driver: local
  redis-data:
    driver: local
  mongodb-data:
    driver: local
  postgres-cms-data:
    driver: local
  minio-data:
    driver: local
  elasticsearch-data:
    driver: local
  kafka-data:
    driver: local
  loki-data:
    driver: local
  grafana-data:
    driver: local
  video-recordings:
    driver: local

networks:
  slate-network:
    driver: bridge
